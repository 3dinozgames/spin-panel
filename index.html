<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spin Gladiators Panel</title>
<style>
:root{color-scheme:light;
  --bg:#f4f2ee;--surface:#fcfcfb;--line:#e4e1da;--grid:#ecebe6;
  --tx:#1b1a18;--tx2:#55524c;--tx3:#8a867e;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --good:#1baf7a;--bad:#e34948;--accent:#c4801f;
  --heat:42,120,214}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#141312;--surface:#1c1b19;--line:#2e2c29;--grid:#262522;
  --tx:#f0efec;--tx2:#c3c2b7;--tx3:#8d8b84;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --good:#2fbf86;--bad:#e66767;--accent:#e2a23c;--heat:57,135,229}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#141312;--surface:#1c1b19;--line:#2e2c29;--grid:#262522;
  --tx:#f0efec;--tx2:#c3c2b7;--tx3:#8d8b84;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --good:#2fbf86;--bad:#e66767;--accent:#e2a23c;--heat:57,135,229}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 auto 0 0;letter-spacing:.2px}
header{flex-wrap:wrap}
header h1 small{display:block;font-size:12px;font-weight:500;color:var(--tx3)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--tx2);padding:6px 10px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
.plogo{height:54px;width:auto;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.ctl{flex-wrap:nowrap!important;overflow-x:auto;max-width:100%;padding:2px 0;scrollbar-width:none}
.ctl::-webkit-scrollbar{display:none}
.ctl>*{flex:none}
.seg,.btn,.dbox{height:36px}
.seg button{height:100%}
.rng{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.dbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 4px 0 10px;cursor:pointer}
.dbox span{font-size:11.5px;color:var(--tx3);white-space:nowrap}
.dbox input{border:0;background:transparent;color:var(--tx);font:inherit;padding:0 4px;height:100%;min-width:0;outline:none}
.dbox:focus-within{border-color:var(--tx3)}
.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.warn{margin:0;padding:10px 14px;border:1px solid var(--accent);border-radius:12px;color:var(--tx);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--tx);border-radius:9px;padding:6px 12px;font:inherit;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tile{padding:12px 14px}
.tile b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15}
.tile span{color:var(--tx2);font-size:13px}
.tile em{display:block;font-style:normal;color:var(--tx3);font-size:12px}
.card{padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 2px}
.card p.sub{margin:0 0 10px;color:var(--tx3);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);margin:-2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--tx3);font-size:11px;font-family:inherit}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--tx3);font-weight:600;font-size:12px}
.tbl td.h{color:var(--tx)}
.scroll{overflow-x:auto}
.bars .row{display:grid;grid-template-columns:118px 1fr 104px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bars .row span:first-child{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:14px;background:var(--grid);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.bars .row b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.bars .row small{color:var(--tx3);font-weight:400}
#tip{position:fixed;pointer-events:none;background:var(--tx);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;line-height:1.35;opacity:0;transition:opacity .1s;z-index:9;white-space:nowrap}
.gate{max-width:420px;margin:12vh auto;padding:22px}
.gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:10px 0}
.err{color:var(--bad)}
.muted{color:var(--tx3)}
.hit{fill:transparent;cursor:crosshair}
@media (max-width:520px){.seg{width:100%}.seg button{flex:1 1 0;min-width:0;padding:6px 2px!important;font-size:13px!important}header{padding:10px 16px}.plogo{height:44px}.bars .row{grid-template-columns:92px 1fr 92px}}

header{background:linear-gradient(rgba(54,33,17,.97),rgba(26,15,8,.97));border-bottom:2px solid var(--g2);box-shadow:inset 0 -1px 0 rgba(255,225,150,.25),0 6px 18px rgba(0,0,0,.55)}
header h1{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:24px;color:#fff3d8;text-shadow:0 2px 0 #3a1e08,0 3px 8px rgba(0,0,0,.8);letter-spacing:.6px}
header h1 small{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13.5px;color:var(--tx2);text-shadow:0 1px 2px #000;letter-spacing:.3px}
.tile,.card{background:linear-gradient(rgba(30,18,9,.96),rgba(12,7,4,.97));border:1.5px solid #a77a34;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,225,150,.2),inset 0 0 0 1px rgba(0,0,0,.35),0 0 0 2px rgba(20,10,4,.85),0 6px 14px rgba(0,0,0,.55)}
.tile span{color:var(--tx2);text-transform:uppercase;font-size:12.5px;letter-spacing:.8px;font-weight:700}
.tile b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:32px;color:#fff6e0;text-shadow:0 2px 0 #000}
.tile em{color:#8fe0a8;font-weight:600}
.card h2{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:19px;color:var(--g1);letter-spacing:.5px;text-shadow:0 2px 0 #1a0c04;
  padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid rgba(232,190,110,.28)}
.card p.sub{color:var(--tx3);font-weight:600;font-size:13px}
.seg{border:1.5px solid var(--g2);border-radius:10px;box-shadow:0 0 0 1.5px #2a1606,0 3px 8px rgba(0,0,0,.5)}
.seg button{background:linear-gradient(#3a2412,#1e1007);color:#ffe7a8;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px}
.seg button+button{border-left:1px solid rgba(200,145,47,.45)}
.seg button[aria-pressed="true"]{background:linear-gradient(#ffe08a,#f2b33c 55%,#d68a1c);color:#3a1d05;text-shadow:0 1px 0 rgba(255,240,200,.6)}
.btn,.dbox{background:linear-gradient(#3a2412,#1e1007);border:1.5px solid var(--g2);color:#ffe7a8;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,220,150,.18),0 3px 8px rgba(0,0,0,.5)}
.btn.pri{background:linear-gradient(#ffe08a,#f2b33c 55%,#d68a1c);border-color:#7a4a10;color:#3a1d05;box-shadow:inset 0 1px 0 rgba(255,250,220,.7),0 3px 0 #7a4a10,0 5px 10px rgba(0,0,0,.5);font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:16px;letter-spacing:.4px}
.dbox span{color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.dbox input{color:#fff1d6;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;color-scheme:dark}
.tbl{font-size:14px}.tbl th{color:var(--g1);text-transform:uppercase;letter-spacing:.6px;font-size:12px;font-weight:700}
.tbl td{border-bottom-color:rgba(214,170,100,.14)}
.tbl td.h{color:#fff6e0;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.bars .track{background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(214,170,100,.25);border-radius:6px}
.bars .fill{border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.25)}

.legend{color:var(--tx2)}
svg text{fill:#b99a6a;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px}

.modeseg button{min-width:76px}
.livestrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1.5px solid #3f8a52;background:linear-gradient(rgba(20,40,22,.9),rgba(10,22,12,.95));font-size:15px}
.livestrip b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:22px;color:#c8ffd6}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#43d18a;box-shadow:0 0 0 0 rgba(67,209,138,.7);animation:pulse 1.8s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(67,209,138,.65)}70%{box-shadow:0 0 0 10px rgba(67,209,138,0)}100%{box-shadow:0 0 0 0 rgba(67,209,138,0)}}
.dot.off{background:#ff6a5a;animation:none}
.score{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.sc{padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(214,170,100,.22)}
.sc span{display:block;color:var(--tx2);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.sc b{display:block;font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:26px;line-height:1.15;color:#fff6e0}
.sc em{display:block;font-style:normal;font-size:12.5px;color:var(--tx3)}
.sc.good{border-color:#43d18a;box-shadow:inset 3px 0 0 #43d18a}.sc.mid{border-color:#ffc23a;box-shadow:inset 3px 0 0 #ffc23a}.sc.bad{border-color:#ff6a5a;box-shadow:inset 3px 0 0 #ff6a5a}.sc.na{opacity:.75}
.sc i{font-style:normal;font-weight:700;font-size:12px;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:2px}
.sc.good i{background:#43d18a;color:#08210f}.sc.mid i{background:#ffc23a;color:#2a1a02}.sc.bad i{background:#ff6a5a;color:#2a0805}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.kv div{padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.25)}
.kv span{display:block;font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.kv b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:22px;color:#fff6e0}

body.tvm header{display:none}

.tvh .st{display:flex;align-items:center;gap:8px;font-size:clamp(13px,1vw,18px);color:var(--tx2)}
.tvh .st.err{color:#ff8a7a}

.bt b.up{color:#7dffad}.bt b.dn{color:#ff9a8a}

.tvcol{display:grid;gap:clamp(10px,1vw,18px);grid-template-rows:auto 1fr;min-height:0}

function dayLbl(d){const x=new Date(d+'T00:00:00');return x.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}

function lineChart(el,days,series){const W=640,H=220,L=36,R=10,T=10,B=26,n=days.length;
  const max=nice(Math.max(1,...series.flatMap(s=>s.v)));const x=i=>L+(n<=1?0:(W-L-R)*i/(n-1)),y=v=>T+(H-T-B)*(1-v/max);
  let g='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${css('--grid')}"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${fmt(Math.round(v))}</text>`}
  const step=Math.max(1,Math.ceil(n/7));days.forEach((d,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${dayLbl(d)}</text>`});
  series.forEach(s=>{g+=`<path d="${s.v.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('')}" fill="none" stroke="${css(s.c)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=n-1;g+=`<circle cx="${x(li)}" cy="${y(s.v[li])}" r="4" fill="${css(s.c)}" stroke="${css('--surface')}" stroke-width="2"/>`});
  g+=`<line id="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="${css('--tx3')}" stroke-dasharray="3 3" opacity="0"/><rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/>`;
  el.innerHTML=`<div class="legend">${series.map(s=>`<span><i style="background:${css(s.c)}"></i>${s.n}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${series.map(s=>s.n).join(', ')}">${g}</svg>`;
  const svg=el.querySelector('svg'),xh=svg.querySelector('#xh'),hit=svg.querySelector('.hit');
  hit.onmousemove=e=>{const b=svg.getBoundingClientRect(),px=(e.clientX-b.left)*W/b.width,i=Math.max(0,Math.min(n-1,Math.round((px-L)/((W-L-R)/Math.max(1,n-1)))));xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('opacity',1);
    showTip(e,`<b>${dayLbl(days[i])}</b><br>${series.map(s=>`${s.n}: <b>${fmt(s.v[i])}</b>`).join('<br>')}`)};
  hit.onmouseleave=()=>{xh.setAttribute('opacity',0);hideTip()}}

/* büyük sayılar kutuya sığsın: tüm kartlar aynı boyutta küçülür (en uzun sayıya göre) */
let FIT_T=0;function fitBig(){clearTimeout(FIT_T);FIT_T=setTimeout(()=>{const bs=[...document.querySelectorAll('.big .bt b')];if(!bs.length)return;bs.forEach(b=>b.style.fontSize='');
  const base=parseFloat(getComputedStyle(bs[0]).fontSize);let k=1;bs.forEach(b=>{const w=b.clientWidth,sw=b.scrollWidth;if(w&&sw>w)k=Math.min(k,w/sw)});
  if(k<1){const px=Math.floor(base*k*0.97);bs.forEach(b=>b.style.fontSize=px+'px')}},30)}
window.addEventListener('resize',fitBig);
function setNum(el,v,f){if(!el)return;f=f||fmt;if(v==null){el.textContent='–';el._v=null;fitBig();return}
  const o=el._v;el._v=v;if(o==null||o===v||typeof v!=='number'){el.textContent=f(v);fitBig();return}
  const t0=performance.now(),D=900,up=v>o;el.classList.remove('up','dn');el.classList.add(up?'up':'dn');
  const card=el.closest('.bt');if(card&&up){card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash');setTimeout(()=>card.classList.remove('flash'),700)}
  const step=n=>{const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3);el.textContent=f(Math.round(o+(v-o)*e));if(k<1&&el._v===v)requestAnimationFrame(step);else if(el._v===v){el.textContent=f(v);fitBig();setTimeout(()=>el.classList.remove('up','dn'),1600)}};requestAnimationFrame(step)}

function hourChart(el,h,opt){opt=opt||{};el._hc=[h,opt];const W=Math.max(300,Math.round(el.clientWidth||760)),H=Math.max(140,Math.round(el.clientHeight||230)),L=34,R=8,T=8,B=24;const now=opt.all?99:new Date().getHours();

  h.forEach((x,i)=>{const X=L+i*bw;if(i<=now)g+=`<rect x="${(X+bw*.15).toFixed(1)}" y="${y(x.m).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${(H-B-y(x.m)).toFixed(1)}" rx="3" fill="${i===now?css('--s3'):css('--s4')}"><title>${i}:00 · ${opt.all?x.m+' maç':'bugün '+x.m+' · dün '+x.my}</title></rect>`;
    if(i%3===0)g+=`<text x="${(X+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${String(i).padStart(2,'0')}</text>`});
  if(!opt.all)g+=`<path d="${h.map((x,i)=>(i?'L':'M')+(L+i*bw+bw/2).toFixed(1)+' '+y(x.my).toFixed(1)).join('')}" fill="none" stroke="${css('--s1')}" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saat saat maç sayısı, bugün ve dün">${g}</svg>`;
  const lg=el.parentNode.querySelector('.legend');if(!lg&&!opt.all)el.insertAdjacentHTML('beforebegin',`<div class="legend"><span><i style="background:${css('--s4')}"></i>Bugün</span><span><i style="background:${css('--s3')}"></i>Şu anki saat</span><span><i style="background:${css('--s1')}"></i>Dün (kesik çizgi)</span></div>`)}

oplam süresi ÷ bugün oturum bitiren farklı cihaz sayısı.", "Oturum, oyun açılınca başlar; oyun kapatılınca ya da arka plana atılınca biter.", "Örnek: 100 oyuncu toplam 1.000 dakika oynadıysa kişi başı 10 dk görünür."], "inst": ["Kurulum", "Seçili tarih aralığında oyunu ilk kez açan cihaz sayısı (yeni kurulum).", "Alttaki “toplam”: analitik kurulduğundan beri tüm kurulumlar.", "Silip yeniden yükleme genelde yeni kurulum sayılır."], "act": ["Aktif oyuncu", "Seçili tarih aralığında oyunu en az bir kez açan farklı cihaz sayısı.", "“Günlük ort.”: dönemdeki günlerin “bugün oynayan” sayılarının ortalaması (ortalama DAU)."], "dmat": ["Maç", "Seçili tarih aralığında biten tüm maçlar: bot maçları, düellolar, Live Arena ve arena maçları.", "“Oyuncu başı”: maç sayısı ÷ dönemde maç oynayan cihaz sayısı."], "ses": ["Oturum", "Seçili tarih aralığında oyunun kaç kez açıldığı (yeni oturum sayısı).", "30 dakikadan uzun arka planda kalıp geri dönmek de yeni oturum sayılır.", "“Günlük ort.”: oturum sayısı ÷ dönemdeki gün sayısı."], "d1": ["Ort. D1 retention", "D1: oyunu bir gün yükleyenlerin kaçta kaçının ertesi gün tekrar açtığı. Seçili dönemdeki kurulum günlerinin ortalamasıdır.", "D7 ve D30: aynı hesap 7 ve 30 gün sonrası için.", "Henüz o güne ulaşmamış kurulum günleri ortalamaya katılmaz."], "dgla": ["Toplam gladyatör", "Google veya Apple ile hesap açmış gerçek oyuncu sayısı (tüm zamanlar). Her kişi bir kez sayılır.", "Misafirler ve botlar dahil değildir. Tarih aralığından etkilenmez."], "sig": ["Giriş yapan", "Seçili tarih aralığında oynayan cihazlardan Google veya Apple hesabıyla giriş yapılmış olanların sayısı.", "Alttaki yüzde: aktif oyuncuların kaçta kaçının hesapla giriş yaptığı. Kalanlar misafir olarak oynuyor."], "opn": ["Bugün giriş", "Bugün (Türkiye saatiyle 00:00'dan beri) oyuna yapılan toplam giriş sayısı. Aynı kişi gün içinde 5 kez girerse 5 sayılır.", "Giriş: oyunun açılması ya da oyundan 30 dakikadan uzun süre çıkıp geri dönülmesi. Kısa süreli uygulama değiştirmeler document.addEventListener('click',e=>{const q=e.target.closest('.hq');if(q){e.preventDefault();e.stopPropagation();const h=HELP[q.dataset.h];if(!h)return;let m=document.getElementById('hqm');if(!m){m=document.createElement('div');m.id='hqm';m.innerHTML='<div class="hqbox" role="dialog"><button class="hqx" aria-label="Kapat">×</button><h3></h3><div class="hqtx"></div></div>';document.body.appendChild(m);m.addEventListener('click',ev=>{if(ev.target===m||ev.target.closest('.hqx'))m.classList.remove('on')})}m.querySelector('h3').textContent=h[0];m.querySelector('.hqtx').innerHTML=h.slice(1).map(p=>'<p>'+p+'</p>').join('');m.classList.add('on');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.getElementById('hqm');if(m)m.classList.remove('on')}});
